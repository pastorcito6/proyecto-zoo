<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zoológico Animales</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #b7e4c7, #74c69d);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .contenedor {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #1b4332;
            margin-bottom: 15px;
            font-size: 38px;
        }

        h2 {
            text-align: center;
            color: #2d6a4f;
            margin-bottom: 25px;
            font-size: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #2d6a4f;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-size: 16px;
        }

        tr:nth-child(even) {
            background-color: #f1f8f5;
        }

        tr:hover {
            background-color: #d8f3dc;
            transition: 0.3s;
        }

        td:first-child {
            font-weight: bold;
            color: #1b4332;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>🦁 Bienvenidos al Zoológico 🐯</h1>

        <h2>Tabla de Animales</h2>

        <table>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Especie</th>
                <th>Color</th>
            </tr>

            <tr>
                <td>Max</td>
                <td>3 años</td>
                <td>Perro</td>
                <td>Café</td>
            </tr>

            <tr>
                <td>Luna</td>
                <td>2 años</td>
                <td>Gato</td>
                <td>Blanco</td>
            </tr>

            <tr>
                <td>Rocky</td>
                <td>5 años</td>
                <td>León</td>
                <td>Dorado</td>
            </tr>

            <tr>
                <td>Coco</td>
                <td>1 año</td>
                <td>Loro</td>
                <td>Verde</td>
            </tr>

            <tr>
                <td>Simba</td>
                <td>4 años</td>
                <td>Tigre</td>
                <td>Naranja</td>
            </tr>

            <tr>
                <td>Nala</td>
                <td>6 años</td>
                <td>Elefante</td>
                <td>Gris</td>
            </tr>

            <tr>
                <td>Toby</td>
                <td>2 años</td>
                <td>Conejo</td>
                <td>Blanco</td>
            </tr>

            <tr>
                <td>Kira</td>
                <td>7 años</td>
                <td>Caballo</td>
                <td>Negro</td>
            </tr>
        </table>

    </div>

</body>
</html>
